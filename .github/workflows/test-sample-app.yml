# End-to-end smoke test for the oniro-app CLI. Chains three reusable workflows:
#
#   scaffold-app.yml   →   build-app.yml        →   emulator-run.yml
#       create                 sign+build (+ test HAP)  install+launch+test on QEMU
#
# A second, parallel scaffold→build chain verifies the NativeCpp template (ArkTS +
# Native C++ via CMake/N-API) scaffolds and builds, its test HAP included.
#
# Each reusable workflow can also be called independently — e.g. a user repo
# could skip the scaffold step and call `build-app.yml` against a checked-in
# project artifact directly.

name: Trigger End-to-End App Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      emulator_url_x86_64:
        description: Install the x86_64 emulator from this URL (e.g. a prerelease asset) instead of the latest release
        type: string
        default: ''
      emulator_url_arm64:
        description: Install the arm64 emulator from this URL (e.g. a prerelease asset) instead of the latest release
        type: string
        default: ''

jobs:
  scaffold:
    uses: ./.github/workflows/scaffold-app.yml
    with:
      project_name: SampleApp
      bundle_name: com.example.sampleapp
      sdk_api: '23'
      template: EmptyAbility
      project_artifact: scaffolded-app

  build:
    needs: scaffold
    uses: ./.github/workflows/build-app.yml
    with:
      project_artifact: ${{ needs.scaffold.outputs.project_artifact }}
      sdk_version: '6.1'
      hap_artifact: built-hap

  emulator:
    needs: [scaffold, build]
    uses: ./.github/workflows/emulator-run.yml
    with:
      project_artifact: ${{ needs.scaffold.outputs.project_artifact }}
      hap_artifact: ${{ needs.build.outputs.hap_artifact }}
      hap_file: ${{ needs.build.outputs.hap_file }}
      test_hap_file: ${{ needs.build.outputs.test_hap_file }}
      bundle_name: com.example.sampleapp
      entry_ability: EntryAbility
      emulator_url: ${{ inputs.emulator_url_x86_64 || '' }}

  # The same device checks on the arm64 emulator (the one Apple Silicon Macs run with
  # HVF). No GitHub-hosted runner gives an arm64 guest KVM, so it runs under TCG on a
  # standard x86_64 runner, where the x86_64 hdc works, with longer waits.
  emulator-arm64:
    needs: [scaffold, build]
    uses: ./.github/workflows/emulator-run.yml
    with:
      project_artifact: ${{ needs.scaffold.outputs.project_artifact }}
      hap_artifact: ${{ needs.build.outputs.hap_artifact }}
      hap_file: ${{ needs.build.outputs.hap_file }}
      test_hap_file: ${{ needs.build.outputs.test_hap_file }}
      bundle_name: com.example.sampleapp
      entry_ability: EntryAbility
      runner: ubuntu-24.04
      emulator_arch: arm64
      emulator_url: ${{ inputs.emulator_url_arm64 || '' }}
      slow_factor: 8
      hdc_wait_seconds: 1800
      device_artifacts: emulator-device-artifacts-arm64
      emulator_log_artifact: emulator-log-arm64

  # The arm64 emulator on an Apple Silicon (M1) macOS runner: Homebrew QEMU, the
  # macOS SDK's hdc and the launcher's macOS path. GitHub's macOS runners are VMs
  # without nested virtualization, so this runs under TCG too, not HVF.
  emulator-arm64-macos:
    needs: [scaffold, build]
    uses: ./.github/workflows/emulator-run.yml
    with:
      project_artifact: ${{ needs.scaffold.outputs.project_artifact }}
      hap_artifact: ${{ needs.build.outputs.hap_artifact }}
      hap_file: ${{ needs.build.outputs.hap_file }}
      test_hap_file: ${{ needs.build.outputs.test_hap_file }}
      bundle_name: com.example.sampleapp
      entry_ability: EntryAbility
      runner: macos-15
      emulator_arch: arm64
      emulator_url: ${{ inputs.emulator_url_arm64 || '' }}
      slow_factor: 8
      hdc_wait_seconds: 1800
      device_artifacts: emulator-device-artifacts-arm64-macos
      emulator_log_artifact: emulator-log-arm64-macos

  # Parallel chain: verify the NativeCpp template scaffolds and builds (native C++ via
  # CMake/N-API). Build success is the gate; emulator launch is already exercised by the
  # EmptyAbility chain above and omitted here to keep runner time down.
  scaffold-nativecpp:
    uses: ./.github/workflows/scaffold-app.yml
    with:
      project_name: NativeCppSample
      bundle_name: com.example.nativecppsample
      sdk_api: '23'
      template: NativeCpp
      project_artifact: scaffolded-nativecpp

  build-nativecpp:
    needs: scaffold-nativecpp
    uses: ./.github/workflows/build-app.yml
    with:
      project_artifact: ${{ needs.scaffold-nativecpp.outputs.project_artifact }}
      sdk_version: '6.1'
      hap_artifact: built-hap-nativecpp
