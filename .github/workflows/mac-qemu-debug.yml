# Temporary: bisect the emulator's QEMU command line on the macOS arm64 runner.
name: mac-qemu-debug
on:
  push:
    branches: [emulator-arm64]
    paths: ['.github/workflows/mac-qemu-debug.yml']
jobs:
  probe:
    runs-on: macos-15
    steps:
      - run: brew install qemu
      - run: |
          curl -fsSL -o emu.zip https://github.com/eclipse-oniro4openharmony/device_board_oniro/releases/download/v7.0.3-rc2/oniro_emulator_arm64.zip
          unzip -q emu.zip && ls -la images
      - name: bisect
        working-directory: images
        run: |
          set +e
          APPEND="earlycon=pl011,0x9000000 ip=dhcp loglevel=8 video=Virtual-1:360x720 console=ttyAMA0,115200 panic=5 init=init root=/dev/ram0 rw ohos.boot.hardware=emulator ohos.boot.timeout_ratio=20 ohos.boot.appfreeze_ratio=9999 ohos.required_mount.system=/dev/block/vdb@/usr@ext4@ro,barrier=1@wait,required ohos.required_mount.vendor=/dev/block/vdc@/vendor@ext4@ro,barrier=1@wait,required ohos.required_mount.misc=/dev/block/vda@/misc@none@none=@wait,required"
          BASE=(-machine virt,gic-version=3 -smp 4 -m 4096M -accel tcg,thread=multi -cpu max,pauth-impdef=on -kernel Image)
          INITRD=(-initrd ramdisk.img)
          DISKS=(-drive if=none,file=./updater.img,format=raw,id=updater,index=0 -device virtio-blk-pci,drive=updater
                 -drive if=none,file=system.img,format=raw,id=system,index=1 -device virtio-blk-pci,drive=system
                 -drive if=none,file=vendor.img,format=raw,id=vendor,index=2 -device virtio-blk-pci,drive=vendor
                 -drive if=none,file=./userdata.img,format=raw,id=userdata,index=3 -device virtio-blk-pci,drive=userdata)
          DEVS=(-device virtio-gpu-pci,xres=360,yres=720,max_outputs=1,addr=08.0 -audiodev none,id=snd0 -device es1370,audiodev=snd0
                -netdev user,id=net0,hostfwd=tcp:127.0.0.1:55565-:55555 -device virtio-net-pci,netdev=net0,romfile= -device virtio-tablet-pci)
          MISC=(-name "Oniro Emulator" -boot c -vga none -rtc base=utc,clock=host)
          v() {
            tag=$1; ser=$2; reader=$3; shift 3
            echo "=== $tag serial=$ser reader=$reader"
            qemu-system-aarch64 "$@" -append "$APPEND" -serial "$ser" -monitor unix:/tmp/m-$tag.sock,server,nowait < /dev/null > ../out-$tag.log 2>&1 &
            pid=$!; sleep 3
            if [ "$reader" = nc ]; then (nc 127.0.0.1 4444 > ../ser-$tag.log 2>&1 &); fi
            sleep 45
            printf 'info registers\n' | nc -U -w 2 /tmp/m-$tag.sock | strings | grep -E "PC=" | head -1
            kill $pid; wait $pid 2>/dev/null; pkill -f "nc 127.0.0.1 4444"
            echo "--- serial: $(strings ../ser-$tag.log 2>/dev/null | wc -l) lines; qemu out: $(head -c 300 ../out-$tag.log)"
          }
          ALL=("${BASE[@]}" "${INITRD[@]}" "${DISKS[@]}" "${DEVS[@]}" "${MISC[@]}" -display none)
          v telnet-noreader "telnet:0.0.0.0:4444,server,nowait" none "${ALL[@]}"
          v telnet-nc       "telnet:0.0.0.0:4444,server,nowait" nc   "${ALL[@]}"
          v telnet-waitoff  "telnet:0.0.0.0:4444,server=on,wait=off" nc "${ALL[@]}"
          v tcp-nc          "tcp:0.0.0.0:4444,server=on,wait=off" nc "${ALL[@]}"
          v telnet-local    "telnet:127.0.0.1:4444,server=on,wait=off" nc "${ALL[@]}"
          v file            "file:../ser-file.log" none "${ALL[@]}"
