# Temporary: why the arm64 emulator kernel prints nothing on the macOS arm64 runner.
name: mac-qemu-debug
on:
  push:
    branches: [emulator-arm64]
    paths: ['.github/workflows/mac-qemu-debug.yml']
jobs:
  probe:
    runs-on: macos-15
    steps:
      - run: brew install qemu
      - run: |
          curl -fsSL -o emu.zip https://github.com/eclipse-oniro4openharmony/device_board_oniro/releases/download/v7.0.3-rc2/oniro_emulator_arm64.zip
          unzip -q emu.zip images/Image && ls -la images && file images/Image
      - name: kernel-only boots
        run: |
          set +e
          k() {
            tag=$1; shift
            echo "=== $tag: $*"
            qemu-system-aarch64 "$@" -kernel images/Image -append "earlycon=pl011,0x9000000 console=ttyAMA0 loglevel=8" \
              -display none -serial file:ser-$tag.log -monitor unix:/tmp/m-$tag.sock,server,nowait &
            pid=$!; sleep 40
            printf 'info status\ninfo registers\n' | nc -U -w 2 /tmp/m-$tag.sock | strings | grep -E "PC=|status" | head -3
            kill $pid; wait $pid 2>/dev/null
            echo "--- serial: $(wc -l < ser-$tag.log) lines"; head -8 ser-$tag.log
          }
          k a -M virt,gic-version=3 -cpu max,pauth-impdef=on -m 4096 -accel tcg
          k b -M virt,gic-version=3 -cpu max,pauth-impdef=on -m 1024 -accel tcg
          k c -M virt -cpu cortex-a72 -m 1024 -accel tcg
          k d -M virt,gic-version=3 -cpu max,pauth-impdef=on -m 1024 -accel tcg,thread=single
          k e -M virt,gic-version=3,virtualization=off,highmem=off -cpu max,pauth-impdef=on -m 1024 -accel tcg
